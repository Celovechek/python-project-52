{% extends "base.html" %}
{% block content %}
<h1 class="my-4">Статусы</h1>
<a href="{% url 'statuses:status_create' %}" class="btn btn-primary mb-3">Создать статус</a>
<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Имя</th>
      <th>Дата создания</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for status in statuses %}
    <tr>
      <td>{{ status.id }}</td>
      <td>{{ status.name }}</td>
      <td>{{ status.created_at|date:"d.m.Y H:i" }}</td>
      <td>
        <a href="{% url 'statuses:status_update' status.pk %}" class="btn btn-info btn-sm">Изменить</a>
        <a href="{% url 'statuses:status_delete' status.pk %}" class="btn btn-danger btn-sm">Удалить</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">Нет статусов</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
